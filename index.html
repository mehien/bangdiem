<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Điểm Học Sinh Pastel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Dancing+Script:wght@700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- html2canvas for downloading card as PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastel: {
                            pink: '#fbcfe8',
                            rose: '#f472b6',
                            soft: '#fdf2f8',
                            deep: '#db2777',
                            card: '#ffffff',
                            bg: '#fce7f3'
                        }
                    },
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        cursive: ['Dancing Script', 'cursive'],
                        comfortaa: ['Comfortaa', 'cursive'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 50%, #f472b6 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient floating hearts background */
        .heart-particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 8s infinite linear;
            opacity: 0.6;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        /* Glassmorphism input card */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px rgba(219, 39, 119, 0.15);
        }

        /* Certificate Styling */
        .report-card {
            background: #ffffff;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(219, 39, 119, 0.25);
            border: 8px solid #fbcfe8;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #fce7f3; }
        ::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 4px; }
    </style>
</head>
<body class="font-sans text-gray-700 antialiased flex flex-col justify-between min-h-screen relative">

    <!-- Background Floating Hearts -->
    <div id="heart-container" class="fixed inset-0 overflow-hidden pointer-events-none z-0"></div>

    <!-- Main Container -->
    <main class="container mx-auto px-4 py-8 relative z-10 flex-grow flex flex-col items-center justify-center">

        <!-- INPUT SECTION -->
        <div id="input-section" class="w-full max-w-md glass-card rounded-3xl p-8 text-center transition-all duration-500 transform hover:scale-[1.01]">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-pink-100 text-pastel-deep mb-4 shadow-inner">
                <i class="fa-solid fa-graduation-cap text-4xl"></i>
            </div>
            
            <h1 class="text-3xl font-extrabold text-pastel-deep font-comfortaa mb-2">Bảng Điểm Học Sinh</h1>
            <p class="text-gray-600 text-sm mb-6">Nhập chính xác tên học sinh lớp Tin 10 để xem bảng điểm 💕</p>

            <form id="name-form" onsubmit="generateReportCard(event)" class="space-y-5">
                <div class="relative">
                    <input type="text" id="student-name-input" required placeholder="Nhập tên học sinh (VD: NGUYỄN VŨ GIA AN)..." 
                           class="w-full px-5 py-4 rounded-2xl border-2 border-pink-200 focus:border-pastel-deep focus:outline-none focus:ring-4 focus:ring-pink-100 transition-all text-gray-800 font-semibold placeholder-gray-400 text-center text-base shadow-sm uppercase">
                </div>

                <button type="submit" class="w-full py-4 bg-gradient-to-r from-pastel-rose to-pastel-deep hover:from-pink-500 hover:to-pink-700 text-white font-bold text-lg rounded-2xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 active:translate-y-0 transition-all flex items-center justify-center gap-3">
                    <i class="fa-solid fa-envelope-open-text text-xl"></i>
                    <span>Xem Bảng Điểm</span>
                </button>
            </form>
        </div>

        <!-- REPORT CARD DISPLAY SECTION (Hidden initially) -->
        <div id="report-card-section" class="hidden w-full max-w-2xl flex-col items-center animate-fade-in my-4">
            
            <!-- Target Card for Download -->
            <div id="printable-card" class="report-card w-full rounded-3xl p-8 sm:p-12 relative overflow-hidden my-4">
                
                <!-- Decorative Corner Badges -->
                <div class="absolute -top-12 -right-12 w-32 h-32 bg-pink-100 rounded-full opacity-60"></div>
                <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-pink-100 rounded-full opacity-60"></div>

                <!-- Header Title -->
                <div class="text-center relative z-10 mb-6">
                    <div class="inline-block bg-pink-100 text-pastel-deep font-bold px-4 py-1.5 rounded-full text-xs sm:text-sm tracking-wide mb-3 shadow-sm">
                        <i class="fa-solid fa-star text-amber-400 mr-1"></i> THPT CHUYÊN THÁI NGUYÊN - LỚP TIN 10
                    </div>
                    <h2 class="text-3xl sm:text-4xl font-extrabold text-gray-800 font-comfortaa tracking-wide mb-2">
                        BẢNG ĐIỂM
                    </h2>
                    
                    <div class="mt-4">
                        <span class="text-lg text-gray-500 font-semibold">Học sinh: </span>
                        <span id="display-name" class="text-2xl sm:text-3xl font-bold text-pastel-deep font-cursive block sm:inline mt-1 sm:mt-0 uppercase"></span>
                    </div>
                </div>

                <hr class="border-pink-200 border-dashed my-4">

                <!-- Dynamic Table: Subject & Score -->
                <div class="relative z-10 mb-2 overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-pink-100/70 text-pastel-deep text-sm uppercase tracking-wider font-bold">
                                <th class="p-3 rounded-l-xl">Môn Học</th>
                                <th class="p-3 rounded-r-xl text-center">Điểm ĐG Thường Xuyên</th>
                            </tr>
                        </thead>
                        <tbody id="scores-table-body" class="divide-y divide-pink-100 text-gray-700 font-semibold text-base">
                            <!-- Filled by JavaScript -->
                        </tbody>
                    </table>
                </div>

            </div>

            <!-- ACTION BUTTONS -->
            <div class="flex flex-wrap items-center justify-center gap-4 mt-4 w-full">
                <button onclick="downloadAsPNG()" class="px-6 py-3.5 bg-pastel-deep hover:bg-pink-700 text-white font-bold rounded-2xl shadow-lg hover:shadow-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-download"></i>
                    <span>Tải Ảnh PNG</span>
                </button>

                <button onclick="resetForm()" class="px-6 py-3.5 bg-white text-pastel-deep border-2 border-pink-200 hover:bg-pink-50 font-bold rounded-2xl shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span>Nhập Tên Khác</span>
                </button>
            </div>
        </div>

    </main>

        // Floating Hearts generator
        function createHearts() {
            const container = document.getElementById('heart-container');
            const heartIcons = ['💖', '🌸', '✨', '💕', '⭐'];
            
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.innerHTML = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.animationDuration = `${5 + Math.random() * 7}s`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                heart.style.fontSize = `${14 + Math.random() * 18}px`;
                container.appendChild(heart);
            }
        }

        // Generate Report Card Function
        function generateReportCard(event) {
            event.preventDefault();
            const rawNameInput = document.getElementById('student-name-input').value.trim().toUpperCase();
            if (!rawNameInput) return;

            // Tìm học sinh trong danh sách (so sánh tương đối)
            let foundStudent = studentsData.find(s => s.name === rawNameInput);

            const tableBody = document.getElementById('scores-table-body');
            tableBody.innerHTML = '';

            if (foundStudent) {
                document.getElementById('display-name').textContent = foundStudent.name;
                for (const [subject, score] of Object.entries(foundStudent.scores)) {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-pink-50/50 transition';
                    row.innerHTML = `
                        <td class="p-3 flex items-center gap-3">
                            <span class="w-2.5 h-2.5 rounded-full bg-pastel-rose inline-block"></span>
                            <span>${subject}</span>
                        </td>
                        <td class="p-3 text-center font-extrabold text-pastel-deep">${score}</td>
                    `;
                    tableBody.appendChild(row);
                }
            } else {
                // Nếu không tìm thấy chính xác, tạo bảng mẫu với tên nhập vào
                document.getElementById('display-name').textContent = rawNameInput;
                const defaultScores = { "Toán Học": "8.5", "Ngữ Văn": "8.0", "Tiếng Anh": "8.0", "Tin Học": "9.0", "Vật Lí": "8.5", "Hóa Học": "8.5" };
                for (const [subject, score] of Object.entries(defaultScores)) {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-pink-50/50 transition';
                    row.innerHTML = `
                        <td class="p-3 flex items-center gap-3">
                            <span class="w-2.5 h-2.5 rounded-full bg-pastel-rose inline-block"></span>
                            <span>${subject}</span>
                        </td>
                        <td class="p-3 text-center font-extrabold text-pastel-deep">${score}</td>
                    `;
                    tableBody.appendChild(row);
                }
            }
            
            // Toggle view
            const inputSec = document.getElementById('input-section');
            const cardSec = document.getElementById('report-card-section');

            inputSec.classList.add('hidden');
            cardSec.classList.remove('hidden');
            cardSec.classList.add('flex');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Reset Form
        function resetForm() {
            document.getElementById('student-name-input').value = '';
            const inputSec = document.getElementById('input-section');
            const cardSec = document.getElementById('report-card-section');

            cardSec.classList.add('hidden');
            cardSec.classList.remove('flex');
            inputSec.classList.remove('hidden');
        }

        // Download as PNG image
        function downloadAsPNG() {
            const cardElement = document.getElementById('printable-card');
            const name = document.getElementById('display-name').textContent || 'HocSinh';

            html2canvas(cardElement, {
                scale: 2,
                useCORS: true,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Bang_Diem_${name.replace(/\s+/g, '_')}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // Initialize on page load
        window.onload = function() {
            createHearts();
        };
    </script>
